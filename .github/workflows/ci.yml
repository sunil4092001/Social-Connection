name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore LinkedIn.sln

      - name: Build
        run: dotnet build LinkedIn.sln --no-restore -c Release

      - name: Unit tests
        run: dotnet test LinkedIn.Tests/LinkedIn.Tests.csproj --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  images:
    name: Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        service: [GatewayService, IdentityService, UserService, PostService, RequirementService, ConnectionService, NotificationService]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/service.Dockerfile --build-arg SERVICE=${{ matrix.service }} -t buildconnect/${{ matrix.service }}:ci .

  frontend:
    name: Build (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # linked/ is currently a separate git repository inside this one (no .gitmodules), so CI may not have it.
      - name: Check for frontend sources
        id: frontend
        run: |
          if [ -f linked/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::linked/ not in checkout; skipping the Angular build"; fi

      - uses: actions/setup-node@v4
        if: steps.frontend.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: linked/package-lock.json

      - name: Install and build
        if: steps.frontend.outputs.present == 'true'
        working-directory: linked
        run: |
          npm ci --no-audit --no-fund
          npx ng build --configuration production

# Local development infrastructure.
# PostgreSQL and SQL Server run natively on the dev machine; this file only adds what is missing.
#
#   docker compose -f docker-compose.dev.yml up -d                  -> Kafka + topic creation
#   docker compose -f docker-compose.dev.yml --profile graph up -d  -> also Neo4j (skip if you use Neo4j Desktop)
#
# Services connect to Kafka at localhost:9092 (see each service's appsettings.json "Kafka" section).

name: buildconnect-dev

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: buildconnect-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Topics are created explicitly below so a typo in a topic name fails loudly instead of creating a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # One-shot container that creates every topic used by the services, then exits.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: buildconnect-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for topic in \
          requirement-created \
          requirement-cancelled \
          professional-interest-submitted \
          professional-interest-decision \
          connection-requested \
          connection-accepted \
          post-liked \
          post-commented \
          notification-events-dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  neo4j:
    profiles: ["graph"]
    image: neo4j:5-community
    container_name: buildconnect-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # Must match ConnectionService appsettings.json (Neo4j:Username / Neo4j:Password).
      NEO4J_AUTH: neo4j/admin@4j
    volumes:
      - neo4j-data:/data

volumes:
  kafka-data:
  neo4j-data:

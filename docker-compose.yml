# The whole BuildConnect platform with one command:
#
#   ./scripts/new-docker-env.ps1          (once: creates .env with random secrets)
#   docker compose up -d --build
#
#   App            http://localhost:4200
#   API gateway    http://localhost:5088/api   (Swagger: http://localhost:5088/swagger)
#   Traces         http://localhost:16686      (Jaeger)
#   Logs           http://localhost:5380       (Seq)
#
# Only those four ports are published, so the stack can run next to the local PostgreSQL, SQL Server and
# Neo4j Desktop. Each service applies its own database migrations at startup. ProductService and OrderService
# (legacy, unused) are intentionally not part of this stack.

name: buildconnect

x-dotnet-service: &dotnet-service
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Production
  Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (run scripts/new-docker-env.ps1)}
  Kafka__BootstrapServers: kafka:9092
  Database__MigrateOnStartup: "true"
  Seq__ServerUrl: http://seq:5341
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  Services__UserService: http://userservice:8080/
  Services__ConnectionService: http://connectionservice:8080/

services:
  # ---------------------------------------------------------------- infrastructure

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in .env}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for topic in requirement-created requirement-cancelled professional-interest-submitted professional-interest-decision \
                     connection-requested connection-accepted post-liked post-commented notification-events-dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
    restart: "no"

  jaeger:
    image: jaegertracing/all-in-one:1.60.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  seq:
    image: datalust/seq:2024.3
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seq-data:/data
    ports:
      - "5380:80"

  # ---------------------------------------------------------------- services

  identityservice:
    <<: *dotnet-service
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: IdentityService } }
    environment:
      <<: *dotnet-env
      ConnectionStrings__DefaultConnection: Host=postgres;Database=IdentityDb;Username=postgres;Password=${POSTGRES_PASSWORD}
      Services__IdentityToUserService: http://userservice:8080
      InternalService__UserServiceKey: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
    depends_on:
      postgres: { condition: service_healthy }

  userservice:
    <<: *dotnet-service
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: UserService } }
    environment:
      <<: *dotnet-env
      ConnectionStrings__DefaultConnection: Host=postgres;Database=linkedin_users;Username=postgres;Password=${POSTGRES_PASSWORD}
      InternalService__UserServiceKey: ${INTERNAL_SERVICE_KEY}
    depends_on:
      postgres: { condition: service_healthy }

  postservice:
    <<: *dotnet-service
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: PostService } }
    environment:
      <<: *dotnet-env
      ConnectionStrings__DefaultConnection: Host=postgres;Database=linkedin_posts;Username=postgres;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  requirementservice:
    <<: *dotnet-service
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: RequirementService } }
    environment:
      <<: *dotnet-env
      ConnectionStrings__DefaultConnection: Host=postgres;Database=requirements;Username=postgres;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  connectionservice:
    <<: *dotnet-service
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: ConnectionService } }
    environment:
      <<: *dotnet-env
      Neo4j__Uri: neo4j://neo4j:7687
      # Neo4j Community has a single user database called "neo4j".
      Neo4j__Database: neo4j
      Neo4j__Password: ${NEO4J_PASSWORD}
    depends_on:
      neo4j: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  notificationservice:
    <<: *dotnet-service
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: NotificationService } }
    environment:
      <<: *dotnet-env
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=linkedin_notifications;User Id=sa;Password=${SQLSERVER_PASSWORD};TrustServerCertificate=True
    depends_on:
      sqlserver: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  gateway:
    <<: *dotnet-service
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: GatewayService } }
    environment:
      <<: *dotnet-env
      ReverseProxy__Clusters__identityCluster__Destinations__d1__Address: http://identityservice:8080/
      ReverseProxy__Clusters__userCluster__Destinations__d1__Address: http://userservice:8080/
      ReverseProxy__Clusters__postCluster__Destinations__d1__Address: http://postservice:8080/
      ReverseProxy__Clusters__connectionCluster__Destinations__d1__Address: http://connectionservice:8080/
      ReverseProxy__Clusters__notificationCluster__Destinations__d1__Address: http://notificationservice:8080/
      ReverseProxy__Clusters__requirementCluster__Destinations__d1__Address: http://requirementservice:8080/
    ports:
      - "5088:8080"
    depends_on:
      identityservice: { condition: service_healthy }
      userservice: { condition: service_healthy }
      postservice: { condition: service_healthy }
      requirementservice: { condition: service_healthy }
      connectionservice: { condition: service_healthy }
      notificationservice: { condition: service_healthy }

  frontend:
    build:
      context: ./linked
      dockerfile: ../docker/frontend.Dockerfile
      additional_contexts:
        dockerfiles: ./docker
    ports:
      - "4200:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  postgres-data:
  sqlserver-data:
  neo4j-data:
  kafka-data:
  seq-data:

# Single-page app: unknown paths (e.g. /profile/123) are served index.html so Angular's router handles them.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles never change; cache them for a long time. index.html is always revalidated.
    location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
